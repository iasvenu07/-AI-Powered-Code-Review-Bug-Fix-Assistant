services:
  web:
    build: .
    ports:
      - "5173:80"
    depends_on:
      - api
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://prism:prism@db:5432/prism
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - prism-data:/var/lib/postgresql/data
volumes:
  prism-data:
